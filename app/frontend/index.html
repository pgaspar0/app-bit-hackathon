    const compTextos = {

    const textosG = {

      consultar: { pt: 'Consultar IA', es: 'Consultar IA', en: 'Query AI' },
      analisando: { pt: 'A analisar...', es: 'Analizando...', en: 'Analyzing...' },

      dica: { pt: 'Escolha uma sugestão ou escreva a sua pergunta.', es: 'Elija una sugerencia o escriba su pregunta.', en: 'Choose a suggestion or type your question.' },
      processando: { pt: 'A processar resposta da IA...', es: 'Procesando respuesta de la IA...', en: 'Processing AI response...' },
      fonte: { pt: 'Fonte:', es: 'Fuente:', en: 'Source:' },
      novaConsulta: { pt: 'Nova Consulta', es: 'Nueva Consulta', en: 'New Query' },
      consultaDados: { pt: 'Consulta de Dados', es: 'Consulta de Datos', en: 'Data Query' },
      descricao: { pt: 'Faça perguntas sobre indicadores sociais e territoriais.', es: 'Haga preguntas sobre indicadores sociales y territoriales.', en: 'Ask questions about social and territorial indicators.' },
    };

    const mockPorServico = {
      formacoes: {
        sugestoes: { pt: ['Onde faltam programas de formação para jovens de baixa renda?', 'Quais regiões têm pouca formação tech mesmo com alta concentração?', 'Onde a cobertura de rede limita o acesso a cursos online?'], es: ['Dónde faltan programas de formación para jóvenes de bajos ingresos?', 'Qué regiones tienen poca formación tech con alta concentración?', 'Dónde la cobertura de red limita el acceso a cursos online?'], en: ['Where are training programs for low-income youth missing?', 'Which regions have low tech training despite high concentration?', 'Where does network coverage limit access to online courses?'] },
        resposta: {
          resposta_ia: { pt: 'A Zona Urbana Norte apresenta 85% de concentração juvenil mas apenas 30% de cobertura de rede, inviabilizando formações online. Recomenda-se priorizar infraestrutura digital antes de expandir programas de formação presencial.', es: 'La Zona Urbana Norte presenta 85% de concentración juvenil pero solo 30% de cobertura de red, imposibilitando formaciones online. Se recomienda priorizar infraestructura digital antes de expandir programas de formación presencial.', en: 'The North Urban Zone has 85% youth concentration but only 30% network coverage, making online training unfeasible. Digital infrastructure should be prioritized before expanding in-person training programs.' },
          dados: [{ regiao: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, valor: 28, fonte: 'Vísent CDRView' }, { regiao: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, valor: 72, fonte: 'Vísent CDRView' }],
          fontes: ['Vísent CDRView', { pt: 'Ministério da Educação', es: 'Ministerio de Educación', en: 'Ministry of Education' }],
        },
      },
      empregabilidade: {
        sugestoes: { pt: ['Regiões com muita concentração de pessoas mas sem emprego formal?', 'Onde o desemprego jovem é mais crítico?', 'Que zonas têm potencial de mão de obra não aproveitado?'], es: ['Regiones con alta concentración de personas pero sin empleo formal?', 'Dónde el desempleo juvenil es más crítico?', 'Qué zonas tienen potencial de mano de obra no aprovechado?'], en: ['Regions with high people concentration but no formal employment?', 'Where is youth unemployment most critical?', 'Which areas have untapped labor potential?'] },
        resposta: {
          resposta_ia: { pt: 'A Zona Urbana Norte regista 85% de concentração populacional mas apenas 22% de emprego formal. O Distrito Industrial Sul tem 75% de cobertura de rede e 68% de emprego, sugerindo correlação positiva entre conectividade e formalidade.', es: 'La Zona Urbana Norte registra 85% de concentración poblacional pero solo 22% de empleo formal. El Distrito Industrial Sur tiene 75% de cobertura de red y 68% de empleo, sugiriendo correlación positiva entre conectividad y formalidad.', en: 'The North Urban Zone has 85% population concentration but only 22% formal employment. The South Industrial District has 75% network coverage and 68% employment, suggesting a positive correlation between connectivity and formality.' },
          dados: [{ regiao: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, valor: 22, fonte: 'Vísent CDRView' }, { regiao: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, valor: 68, fonte: 'Vísent CDRView' }],
          fontes: ['Vísent CDRView', { pt: 'INE', es: 'INE', en: 'National Statistics' }],
        },
      },
      experiencias: {
        sugestoes: { pt: ['Onde há iniciativas sociais bem-sucedidas que podem ser replicadas?', 'Que comunidades têm líderes locais ativos?', 'Onde falta apoio institucional a projetos culturais?'], es: ['Dónde hay iniciativas sociales exitosas que pueden replicarse?', 'Qué comunidades tienen líderes locales activos?', 'Dónde falta apoyo institucional a proyectos culturales?'], en: ['Where are successful social initiatives that can be replicated?', 'Which communities have active local leaders?', 'Where is institutional support for cultural projects lacking?'] },
        resposta: {
          resposta_ia: { pt: 'O Distrito Industrial Sul concentra 3 iniciativas comunitárias activas (cooperativa digital, horta urbana, centro de formação). A Zona Urbana Norte não regista nenhuma experiência estruturada, apesar da alta concentração populacional.', es: 'El Distrito Industrial Sur concentra 3 iniciativas comunitarias activas (cooperativa digital, huerta urbana, centro de formación). La Zona Urbana Norte no registra ninguna experiencia estructurada, a pesar de la alta concentración poblacional.', en: 'The South Industrial District has 3 active community initiatives (digital cooperative, urban garden, training center). The North Urban Zone has no structured experiences, despite high population concentration.' },
          dados: [{ regiao: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, valor: 0, fonte: 'Vísent CDRView' }, { regiao: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, valor: 3, fonte: 'Vísent CDRView' }],
          fontes: ['Vísent CDRView', { pt: 'Registo Comunitário', es: 'Registro Comunitario', en: 'Community Registry' }],
        },
      },
      mentorias: {
        sugestoes: { pt: ['Onde faltam programas de mentoria pública?', 'Que regiões têm potencial para conectar mentores e jovens?', 'Onde a falta de mentoria agrava o desemprego jovem?'], es: ['Dónde faltan programas de mentoría pública?', 'Qué regiones tienen potencial para conectar mentores y jóvenes?', 'Dónde la falta de mentoría agrava el desempleo juvenil?'], en: ['Where are public mentorship programs missing?', 'Which regions have potential to connect mentors and youth?', 'Where does lack of mentorship worsen youth unemployment?'] },
        resposta: {
          resposta_ia: { pt: 'A Zona Urbana Norte não possui nenhum programa de mentoria pública activo, contrastando com o Distrito Industrial Sul que tem 2 programas em funcionamento. Recomenda-se criar pontos de mentoria nas áreas com alta concentração e baixa cobertura.', es: 'La Zona Urbana Norte no posee ningún programa de mentoría pública activo, contrastando con el Distrito Industrial Sur que tiene 2 programas en funcionamiento. Se recomienda crear puntos de mentoría en las áreas con alta concentración y baja cobertura.', en: 'The North Urban Zone has no active public mentorship programs, contrasting with the South Industrial District which has 2 programs running. Mentorship points should be created in areas with high concentration and low coverage.' },
          dados: [{ regiao: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, valor: 0, fonte: 'Vísent CDRView' }, { regiao: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, valor: 2, fonte: 'Vísent CDRView' }],
          fontes: ['Vísent CDRView', { pt: 'Ministério da Juventude', es: 'Ministerio de Juventud', en: 'Ministry of Youth' }],
        },
      },
      saude_mental: {
        sugestoes: { pt: ['Onde a falta de internet impede acesso a suporte de saúde mental?', 'Que regiões têm maior risco de isolamento social?', 'Onde falta conectividade antes de chegarem programas de saúde mental?'], es: ['Dónde la falta de internet impide acceso a soporte de salud mental?', 'Qué regiones tienen mayor riesgo de aislamiento social?', 'Dónde falta conectividad antes de llegar programas de salud mental?'], en: ['Where does lack of internet prevent access to mental health support?', 'Which regions have the highest risk of social isolation?', 'Where is connectivity lacking before mental health programs arrive?'] },
        resposta: {
          resposta_ia: { pt: 'A Zona Urbana Norte tem apenas 30% de cobertura de rede, impossibilitando consultas remotas de saúde mental para 85% da população. O Distrito Industrial Sul, com 75% de cobertura, já consegue oferecer teleatendimento psicológico básico.', es: 'La Zona Urbana Norte tiene solo 30% de cobertura de red, imposibilitando consultas remotas de salud mental para 85% de la población. El Distrito Industrial Sur, con 75% de cobertura, ya puede ofrecer teleatención psicológica básica.', en: 'The North Urban Zone has only 30% network coverage, making remote mental health consultations impossible for 85% of the population. The South Industrial District, with 75% coverage, can already offer basic psychological telecare.' },
          dados: [{ regiao: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, valor: 30, fonte: 'Vísent CDRView' }, { regiao: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, valor: 75, fonte: 'Vísent CDRView' }],
          fontes: ['Vísent CDRView', { pt: 'OMS', es: 'OMS', en: 'WHO' }],
        },
      },
    };

    const regioesMapa = [
      { id: 'zona-norte', nome: { pt: 'Zona Urbana Norte', es: 'Zona Urbana Norte', en: 'North Urban Zone' }, lat: -15.195, lng: 12.15, cobertura_rede: 30, concentracao: 85 },
      { id: 'distrito-sul', nome: { pt: 'Distrito Industrial Sul', es: 'Distrito Industrial Sur', en: 'South Industrial District' }, lat: -15.21, lng: 12.165, cobertura_rede: 75, concentracao: 40 },
    ];

    const tagsM = {
      faltaConexao: { pt: 'Falta Conectividade', es: 'Falta Conectividad', en: 'Lacks Connectivity' },
      conexaoOK: { pt: 'Conectividade OK', es: 'Conectividad OK', en: 'Connectivity OK' },
      altaConc: { pt: 'Alta Concentração', es: 'Alta Concentración', en: 'High Concentration' },

      faltaServ: { pt: 'Falta {servico}', es: 'Falta {servico}', en: 'Lacks {servico}' },

    const alertaStatus = {

    const indicadoresPorServico = {
      formacoes: (r) => ({ valor: r.id === 'zona-norte' ? 28 : 72, label: { pt: 'Cobertura de Formação', es: 'Cobertura de Formación', en: 'Training Coverage' }, alerta: r.id === 'zona-norte' }),
      empregabilidade: (r) => ({ valor: r.id === 'zona-norte' ? 22 : 68, label: { pt: 'Taxa de Emprego Formal', es: 'Tasa de Empleo Formal', en: 'Formal Employment Rate' }, alerta: r.id === 'zona-norte' }),
      experiencias: (r) => ({ valor: r.id === 'zona-norte' ? 0 : 3, label: { pt: 'Iniciativas Activas', es: 'Iniciativas Activas', en: 'Active Initiatives' }, alerta: r.id === 'zona-norte' }),
      mentorias: (r) => ({ valor: r.id === 'zona-norte' ? 0 : 2, label: { pt: 'Programas de Mentoria', es: 'Programas de Mentoría', en: 'Mentorship Programs' }, alerta: r.id === 'zona-norte' }),
      saude_mental: (r) => ({ valor: r.cobertura_rede, label: { pt: 'Cobertura p/ Teleatendimento', es: 'Cobertura para Teleatención', en: 'Telecare Coverage' }, alerta: r.cobertura_rede < 40 }),

    function getCor(r, servico) {
      const ind = indicadoresPorServico[servico](r);
      return ind.alerta ? '#E63946' : r.cobertura_rede < 60 ? '#F4A261' : '#06D6A0';
    }

    function tr(obj, idioma) { return typeof obj === 'string' ? obj : obj[idioma]; }

    // ─── SidebarConsulta ───────────────────────────────────────────
    function SidebarConsulta({ servicoAtivo, regiaoAtiva, onRegiaoChange, corBase, idioma }) {
      const [query, setQuery] = useState('');
      const [resultado, setResultado] = useState(null);
      const [carregando, setCarregando] = useState(false);
      const mock = mockPorServico[servicoAtivo];
      const res = mock.resposta;

      return h('div', { className: 'flex flex-col gap-4 sm:gap-5 p-4 sm:p-6' },
        h('div', { className: 'flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 sm:gap-3' },
          h('div', { className: 'w-full sm:w-auto' },
            h('h2', { className: 'text-base sm:text-lg font-semibold text-gray-800' }, tr(textosG.consultaDados, idioma)),
            h('p', { className: 'text-xs sm:text-sm text-gray-400' }, tr(textosG.descricao, idioma))
          ),
          h('select', { value: regiaoAtiva, onChange: (e) => onRegiaoChange(e.target.value), className: 'w-full sm:w-auto rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs text-gray-600 outline-none transition focus:border-[#00B4D8]' },
            regioesLista.map((r) => h('option', { key: r.id, value: r.id }, tr(r.nome, idioma)))
          )
        ),
        h('div', { className: 'flex flex-wrap gap-1.5' },
          h('span', { className: 'rounded-full px-2 sm:px-3 py-1 text-[9px] sm:text-[10px] font-medium text-white whitespace-nowrap', style: { backgroundColor: corBase } }, tr(nomesServ[servicoAtivo], idioma)),
          regiaoAtiva !== 'todas' && h('span', { className: 'rounded-full bg-gray-100 px-2 sm:px-3 py-1 text-[9px] sm:text-[10px] text-gray-500 whitespace-nowrap' }, tr(regioesLista.find(r => r.id === regiaoAtiva)?.nome, idioma))
        ),
        h('form', { onSubmit: (e) => { e.preventDefault(); if (!query.trim()) return; setCarregando(true); setTimeout(() => { setResultado(mock.resposta); setCarregando(false); }, 1200); }, className: 'flex flex-col sm:flex-row gap-2' },
          h('input', { type: 'text', value: query, onChange: (e) => setQuery(e.target.value), placeholder: mock.sugestoes[idioma][0], className: 'w-full flex-1 rounded-2xl border border-gray-200 bg-gray-50 px-4 sm:px-5 py-2.5 sm:py-3 text-sm shadow-sm outline-none transition focus:border-[#00B4D8] focus:bg-white focus:shadow-md' }),
          h('button', { type: 'submit', disabled: carregando || !query.trim(), className: 'w-full sm:w-auto rounded-2xl px-5 sm:px-6 py-2.5 sm:py-3 text-sm font-semibold text-white shadow-sm transition disabled:opacity-50 min-h-[44px]', style: { backgroundColor: corBase } }, carregando ? tr(textosG.analisando, idioma) : tr(textosG.consultar, idioma))
        ),
        !resultado && h('div', { className: 'flex flex-wrap gap-1.5 sm:gap-2' }, mock.sugestoes[idioma].map((s, i) => h('button', { key: i, type: 'button', onClick: () => setQuery(s), className: 'rounded-lg sm:rounded-xl border border-gray-200 bg-gray-50 px-3 sm:px-4 py-1.5 sm:py-2 text-[11px] sm:text-xs text-gray-500 transition hover:border-[#00B4D8] hover:bg-blue-50 hover:text-[#00B4D8] text-left leading-snug' }, s))),
        !resultado && !carregando && h('div', { className: 'flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gray-200 py-8 sm:py-16 text-center' },
          h('div', { className: 'mb-3 flex size-10 sm:size-12 items-center justify-center rounded-full bg-gray-100 text-base sm:text-lg text-gray-400 font-mono' }, '?'),
          h('p', { className: 'text-sm font-medium text-gray-400' }, tr(textosG.aguardando, idioma)),
          h('p', { className: 'text-xs text-gray-300 px-4' }, tr(textosG.dica, idioma))
        ),
        carregando && h('div', { className: 'flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-[#00B4D8]/20 py-8 sm:py-16 text-center' },
          h('div', { className: 'mb-4 size-8 sm:size-10 animate-spin rounded-full border-[3px] border-gray-100 border-t-current', style: { color: corBase } }),
          h('p', { className: 'text-sm text-gray-500' }, tr(textosG.processando, idioma))
        ),
        resultado && !carregando && h('div', { className: 'flex flex-col gap-4 sm:gap-5' },
          h('div', { className: 'rounded-2xl px-4 sm:px-5 py-3 sm:py-4', style: { borderLeft: '4px solid ' + corBase, backgroundColor: corBase + '10' } }, h('p', { className: 'text-xs sm:text-sm leading-relaxed text-gray-700' }, tr(res.resposta_ia, idioma))),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' }, res.dados.map((item, i) =>
            h('div', { key: i, className: 'rounded-2xl border border-gray-100 bg-white p-4 sm:p-5 shadow-sm' },
              h('p', { className: 'text-[10px] sm:text-xs font-medium uppercase tracking-wider text-gray-400' }, tr(item.regiao, idioma)),
              h('p', { className: 'mt-2 text-2xl sm:text-3xl font-bold text-gray-800' }, item.valor, h('span', { className: 'text-sm sm:text-base font-normal text-gray-400' }, '%')),
              h('div', { className: 'mt-3 sm:mt-4 h-1.5 sm:h-2 overflow-hidden rounded-full bg-gray-100' }, h('div', { className: 'h-full rounded-full transition-all', style: { width: Math.min(item.valor, 100) + '%', backgroundColor: corBase } })),
              h('p', { className: 'mt-3 sm:mt-4 text-[10px] sm:text-[11px] text-gray-400' }, tr(textosG.fonte, idioma) + ' ' + tr(item.fonte, idioma))
            )
          )),
          h('div', { className: 'flex flex-wrap gap-1.5 sm:gap-2' }, res.fontes.map((f, i) => h('span', { key: i, className: 'rounded-full bg-gray-100 px-2 sm:px-3 py-1 text-[9px] sm:text-[10px] text-gray-500' }, tr(f, idioma)))),
          h('button', { type: 'button', onClick: () => { setQuery(''); setResultado(null); }, className: 'self-start rounded-lg sm:rounded-xl border border-gray-200 px-4 sm:px-5 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 min-h-[40px]' }, '+ ' + tr(textosG.novaConsulta, idioma))
        )
      );
    }

    // ─── MapaInterativo com Leaflet ────────────────────────────────
    function MapaInterativo({ servicoAtivo, idioma }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const circlesRef = useRef([]);
      const [selected, setSelected] = useState(null);

      useEffect(() => {
        if (mapInstance.current) return;

        const map = L.map(mapRef.current, { zoomControl: false }).setView([-15.202, 12.158], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);

        if (window.innerWidth > 640) {
          L.control.zoom({ position: 'bottomleft' }).addTo(map);
        }

        map.on('resize', function() {
          map.invalidateSize();
        });

        mapInstance.current = map;

        circlesRef.current = [];
        regioesMapa.forEach((r) => {
          const cor = getCor(r, servicoAtivo);
          const circle = L.circle([r.lat, r.lng], {
            radius: 300, color: cor, fillColor: cor, fillOpacity: 0.35, weight: 2,
          }).addTo(map);

          circle.on('click', () => setSelected(r));
          circle.bindPopup(buildPopup(r, servicoAtivo, idioma));
          circlesRef.current.push(circle);
        });

        return () => { map.remove(); mapInstance.current = null; };
      }, []);

      useEffect(() => {
        if (!mapInstance.current) return;
        circlesRef.current.forEach((c, i) => {
          const r = regioesMapa[i];
          const cor = getCor(r, servicoAtivo);
          c.setStyle({ color: cor, fillColor: cor });
          c.unbindPopup();
          c.bindPopup(buildPopup(r, servicoAtivo, idioma));
        });
        setSelected(null);
      }, [servicoAtivo, idioma]);

      function buildPopup(r, servico, lang) {
        const cor = getCor(r, servico);
        const ind = indicadoresPorServico[servico](r);
        return '<div style="font-size:13px;font-family:system-ui;max-width:260px">' +
          '<strong style="font-size:14px">' + tr(r.nome, lang) + '</strong><br/>' +
          '<span style="color:#6b7280">' + tr(tagsM.cobertura, lang) + '</span> <strong>' + r.cobertura_rede + '%</strong><br/>' +
          '<span style="color:#6b7280">' + tr(tagsM.concentracao, lang) + '</span> <strong>' + r.concentracao + '%</strong><br/>' +
          '<span style="color:#6b7280">' + tr(ind.label, lang) + ':</span> <strong>' + ind.valor + '%</strong><br/>' +
          '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">' +
          '<span style="background:#dbeafe;padding:1px 8px;border-radius:999px;font-size:10px;color:#1d4ed8">' + (r.cobertura_rede < 40 ? tr(tagsM.faltaConexao, lang) : tr(tagsM.conexaoOK, lang)) + '</span>' +
          '<span style="background:#dbeafe;padding:1px 8px;border-radius:999px;font-size:10px;color:#1d4ed8">' + (r.concentracao > 70 ? tr(tagsM.altaConc, lang) : tr(tagsM.baixaConc, lang)) + '</span>' +
          '<span style="background:#dbeafe;padding:1px 8px;border-radius:999px;font-size:10px;color:#1d4ed8">' + (ind.alerta ? tr(tagsM.faltaServ, lang).replace('{servico}', tr(nomesServ[servico], lang)) : tr(tagsM.servOK, lang).replace('{servico}', tr(nomesServ[servico], lang))) + '</span></div></div>';
      }

      return h('div', { className: 'relative size-full' },
        h('div', { ref: mapRef, className: 'size-full rounded-xl', style: { minHeight: '300px', height: '100%' } }),
        selected && h('div', { className: 'fixed sm:absolute left-2 right-2 sm:left-auto sm:right-auto bottom-4 sm:top-1/2 sm:-translate-y-1/2 z-[1000] mx-auto max-w-[calc(100vw-16px)] sm:max-w-xs rounded-2xl border border-gray-700 bg-gray-800/95 p-4 sm:p-5 shadow-2xl backdrop-blur-sm' },
          h('div', { className: 'flex items-center justify-between gap-4' },
            h('div', { className: 'min-w-0' },
              h('div', { className: 'flex items-center gap-2' }, h('span', { className: 'size-2 sm:size-2.5 rounded-full shrink-0', style: { backgroundColor: getCor(selected, servicoAtivo) } }), h('p', { className: 'text-sm font-semibold text-white truncate' }, tr(selected.nome, idioma))),
              h('p', { className: 'mt-1 text-[11px] text-gray-400' }, getCor(selected, servicoAtivo) === '#E63946' ? tr(alertaStatus.alerta, idioma) : tr(alertaStatus.regular, idioma))
            ),
            h('button', { onClick: () => setSelected(null), className: 'rounded-full p-1 text-gray-500 transition hover:bg-gray-700 hover:text-white shrink-0' }, h('svg', { className: 'size-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M6 18L18 6M6 6l12 12' })))
          ),
          h('div', { className: 'mt-3 sm:mt-4 grid grid-cols-3 gap-3' },
            h('div', { className: 'min-w-0' }, h('p', { className: 'text-[10px] text-gray-500 truncate' }, tr(tagsM.cobertura, idioma)), h('p', { className: 'text-base sm:text-lg font-bold text-white' }, selected.cobertura_rede + '%')),
            h('div', { className: 'min-w-0' }, h('p', { className: 'text-[10px] text-gray-500 truncate' }, tr(tagsM.concentracao, idioma)), h('p', { className: 'text-base sm:text-lg font-bold text-white' }, selected.concentracao + '%')),
            h('div', { className: 'min-w-0' }, h('p', { className: 'text-[10px] text-gray-500 truncate' }, tr(indicadoresPorServico[servicoAtivo](selected).label, idioma)), h('p', { className: 'text-base sm:text-lg font-bold text-white' }, indicadoresPorServico[servicoAtivo](selected).valor + '%'))
          ),
          h('div', { className: 'mt-3 flex flex-wrap gap-1.5' },
            [selected.cobertura_rede < 40 ? tr(tagsM.faltaConexao, idioma) : tr(tagsM.conexaoOK, idioma),
             selected.concentracao > 70 ? tr(tagsM.altaConc, idioma) : tr(tagsM.baixaConc, idioma),
             indicadoresPorServico[servicoAtivo](selected).alerta ? tr(tagsM.faltaServ, idioma).replace('{servico}', tr(nomesServ[servicoAtivo], idioma)) : tr(tagsM.servOK, idioma).replace('{servico}', tr(nomesServ[servicoAtivo], idioma)),
            ].map((tag, i) => h('span', { key: i, className: 'rounded-full bg-gray-700 px-2 sm:px-3 py-1 text-[10px] sm:text-[11px] text-gray-300' }, tag))
          )
        ),
        h('div', { className: 'absolute bottom-3 right-3 z-[1000] flex flex-col gap-1 rounded-xl border border-gray-700 bg-gray-800/80 px-3 py-2 sm:px-4 sm:py-3 backdrop-blur-sm' },
          h('p', { className: 'text-[10px] sm:text-[11px] font-medium text-gray-400' }, tr(legendas.titulo, idioma)),
          h('div', { className: 'flex items-center gap-1.5 sm:gap-2' }, h('span', { className: 'size-2 sm:size-2.5 rounded-full bg-[#E63946]' }), h('span', { className: 'text-[10px] sm:text-[11px] text-gray-300 whitespace-nowrap' }, tr(legendas.alerta, idioma))),
          h('div', { className: 'flex items-center gap-1.5 sm:gap-2' }, h('span', { className: 'size-2 sm:size-2.5 rounded-full bg-[#F4A261]' }), h('span', { className: 'text-[10px] sm:text-[11px] text-gray-300 whitespace-nowrap' }, tr(legendas.parcial, idioma))),
          h('div', { className: 'flex items-center gap-1.5 sm:gap-2' }, h('span', { className: 'size-2 sm:size-2.5 rounded-full bg-[#06D6A0]' }), h('span', { className: 'text-[10px] sm:text-[11px] text-gray-300 whitespace-nowrap' }, tr(legendas.solida, idioma)))
        )
      );
    }

    // ─── DashboardLayout ───────────────────────────────────────────
    function DashboardLayout() {
      const [servicoAtivo, setServicoAtivo] = useState('formacoes');
      const [regiaoAtiva, setRegiaoAtiva] = useState('todas');
      const [idioma, setIdioma] = useState('pt');
      const corBase = servicoCores[servicoAtivo];

      return h('div', { className: 'min-h-screen bg-[#F8F9FA] overflow-x-hidden' },
        h('header', { className: 'flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-gray-200 bg-white px-4 py-3 sm:px-8 sm:py-5 shadow-sm' },
          h('div', { className: 'flex items-center gap-3 w-full sm:w-auto' },
            h('div', { className: 'flex size-8 sm:size-9 shrink-0 items-center justify-center rounded-lg text-xs sm:text-sm font-bold text-white', style: { backgroundColor: corBase } }, 'B'),
            h('h1', { className: 'text-base sm:text-xl font-semibold tracking-tight text-gray-800 truncate' }, 'App BiT ', h('span', { className: 'font-light text-gray-400 hidden xs:inline' }, '—'), ' ', h('span', { className: 'font-normal text-gray-500 text-sm sm:text-base hidden sm:inline' }, tr(compTextos.dashboardTitle, idioma)))
          ),
          h('div', { className: 'flex items-center gap-2 sm:gap-4 w-full sm:w-auto justify-between sm:justify-end' },
            h('div', { className: 'flex rounded-lg border border-gray-200 bg-gray-50 p-0.5 shrink-0' },
              [{ id: 'pt', label: 'PT' }, { id: 'es', label: 'ES' }, { id: 'en', label: 'EN' }].map((l) =>
                h('button', { key: l.id, onClick: () => setIdioma(l.id), className: 'rounded-md px-2 sm:px-3 py-1 text-[11px] sm:text-xs font-medium transition ' + (idioma === l.id ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400 hover:text-gray-600') }, l.label)
              )
            ),
            h('span', { className: 'inline-flex items-center gap-2 rounded-full bg-green-50 px-3 sm:px-4 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium text-green-700 ring-1 ring-green-200 whitespace-nowrap' },
              h('span', { className: 'size-1.5 sm:size-2 rounded-full bg-green-500 shrink-0' }),
              h('span', { className: 'hidden sm:inline' }, tr(compTextos.badge, idioma)),
              h('span', { className: 'sm:hidden' }, 'CDRView')
            )
          )
        ),
        h('div', { className: 'overflow-x-auto border-b border-gray-200 bg-white scrollbar-hide' },
          h('div', { className: 'flex items-center gap-1 sm:gap-2 px-4 sm:px-8 py-2 sm:py-3 w-max min-w-full' },
            servicos.map((s) => h('button', {
              key: s.id, onClick: () => setServicoAtivo(s.id),
              className: 'whitespace-nowrap rounded-lg sm:rounded-xl px-2.5 sm:px-4 py-1.5 sm:py-2 text-[11px] sm:text-xs font-medium transition ' + (servicoAtivo === s.id ? 'bg-gray-800 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'),
            }, tr(s.label, idioma)))
          )
        ),
        h('main', { className: 'flex flex-col gap-3 sm:gap-5 p-3 sm:p-4 lg:p-6 lg:flex-row lg:h-[calc(100vh-96px)]' },
          h('section', { className: 'w-full lg:w-[40%] lg:flex lg:flex-col lg:h-full lg:overflow-hidden' },
            h('div', { className: 'rounded-xl bg-white shadow-sm lg:flex-1 lg:overflow-y-auto' }, h(SidebarConsulta, { servicoAtivo, regiaoAtiva, onRegiaoChange: setRegiaoAtiva, corBase, idioma }))
          ),
          h('section', { className: 'w-full lg:w-[60%] lg:flex lg:flex-col lg:h-full' },
            h('div', { className: 'flex-1 overflow-hidden rounded-xl bg-white shadow-sm' }, h(MapaInterativo, { servicoAtivo, idioma }))
          )
        )
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(h(DashboardLayout, null));
  </script>
</body>
