# ============================================================
# BiT App — Backend Spring Boot — Equipa 48
# ============================================================
# Todos os valores vêm de variáveis de ambiente (ver app/.env.example).
# Os valores depois de ':' são defaults usados se a variável não existir —
# úteis para correr localmente sem configurar nada.
# ============================================================

spring.application.name=bitapp-backend

# --- Base de dados ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bitapp}
spring.datasource.username=${DB_USER:bit}
spring.datasource.password=${DB_PASSWORD:bit}
spring.datasource.driver-class-name=org.postgresql.Driver

# CRÍTICO — nunca mudar para create, update ou create-drop.
# O schema já existe (app/data/schema.sql) e é gerido externamente pelo
# Data Architect + pipeline Python. Ver README > Troubleshooting se o
# arranque falhar aqui.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JSON ---
# Converte campos Java camelCase para snake_case no JSON de saída
# (ex: clusterCode -> cluster_code), casando com docs/DATA_CONTRACT.md
# sem precisar de @JsonProperty em cada campo.
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CORS (para o frontend React, noutra origem/porta) ---
# Em produção, substitui '*' pelo domínio real do frontend.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Serviço de IA (Hércules) ---
# Deixa vazio (default) para usar sempre a resposta de fallback local.
# Assim que o serviço de IA existir, define AI_SERVICE_URL no .env.
ai.service.url=${AI_SERVICE_URL:}

# --- Pipeline de ingestão (usado por POST /ingestao/reprocessar) ---
ingest.script.path=${INGEST_SCRIPT_PATH:../data/ingest.py}

# --- Porta do servidor ---
server.port=${SERVER_PORT:8080}

# --- Logs ---
logging.level.com.bitapp.backend=INFO
